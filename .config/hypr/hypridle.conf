general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = killall hyprlock
    before_sleep_cmd = loginctl lock-session && playerctl -a pause
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim screen backlight after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s s 10%
    on-resume = brightnessctl -r
}

# Turn off screen (DPMS off) after 5 minutes
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock screen after 6 minutes
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# Suspend system after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
